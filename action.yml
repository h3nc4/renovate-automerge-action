name: Automerge Renovate pull request
description: >
  Merges the Renovate pull request a finished CI run belongs to, so a passing bump lands
  immediately instead of waiting for Renovate's next scan to notice and merge it. Refuses
  anything that is not a Renovate pull request carrying the agreed label, and refuses to merge
  a commit CI did not test.
author: Henrique Almeida
branding:
  icon: git-merge
  color: blue

inputs:
  label:
    description: >
      Label the pull request must carry. Apply it from renovate.json, on the same packageRules
      entry that sets automerge, so the policy for which update types may merge lives there and
      is not restated here. Majors then never carry it.
    required: false
    default: automerge
  bot-login:
    description: Login that must have opened the pull request and triggered the CI run.
    required: false
    default: renovate[bot]
  merge-method:
    description: One of squash, merge or rebase.
    required: false
    default: squash
  delete-branch:
    description: Delete the branch after merging.
    required: false
    default: "true"
  client-id:
    description: >
      GitHub App id used to mint a token. Defaults to the app this action was written for, so a
      caller only passes the private key. Anyone else has to override it.
    required: false
    default: "000000"
  private-key:
    description: >
      Private key of that app, from a secret. An action cannot read the secrets context, so the
      calling workflow has to pass it.
    required: false
    default: ""
  token:
    description: >
      Token to use instead of an app, such as a personal access token. Falls back to the job
      token, which merges but triggers no workflows.
    required: false
    default: ""

outputs:
  merged:
    description: The merged pull request number, empty when nothing was merged.
    value: ${{ steps.merge.outputs.merged }}

runs:
  using: composite
  steps:
    - name: Mint an app token
      id: app-token
      if: inputs.token == '' && inputs.client-id != ''
      uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
      with:
        client-id: ${{ inputs.client-id }}
        private-key: ${{ inputs.private-key }}

    # Every guard is repeated here rather than left to the caller's `if`: a caller that omits
    # one should still be safe. github.actor and workflow_run.actor.login are GitHub identities,
    # so they cannot be forged by setting a commit author.
    - name: Merge the pull request
      id: merge
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token || steps.app-token.outputs.token || github.token }}
        GH_REPO: ${{ github.repository }}
        EVENT_NAME: ${{ github.event_name }}
        RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        RUN_EVENT: ${{ github.event.workflow_run.event }}
        RUN_ACTOR: ${{ github.event.workflow_run.actor.login }}
        HEAD_REPO: ${{ github.event.workflow_run.head_repository.full_name }}
        HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        THIS_REPO: ${{ github.repository }}
        LABEL: ${{ inputs.label }}
        BOT: ${{ inputs.bot-login }}
        MERGE_METHOD: ${{ inputs.merge-method }}
        DELETE_BRANCH: ${{ inputs.delete-branch }}
      run: |
        set -euo pipefail

        skip() {
          echo "merged=" >>"${GITHUB_OUTPUT}"
          echo "::notice::$1"
          exit 0
        }

        refuse() {
          echo "merged=" >>"${GITHUB_OUTPUT}"
          echo "::warning::$1"
          exit 0
        }

        [ "${EVENT_NAME}" = "workflow_run" ] ||
          skip "Triggered by ${EVENT_NAME}, not workflow_run. Nothing to do"
        [ "${RUN_EVENT}" = "pull_request" ] ||
          skip "The CI run was triggered by ${RUN_EVENT}, not a pull request"
        [ "${RUN_CONCLUSION}" = "success" ] ||
          skip "CI concluded '${RUN_CONCLUSION}', so nothing is merged"
        [ "${RUN_ACTOR}" = "${BOT}" ] ||
          skip "CI was triggered by '${RUN_ACTOR}', not ${BOT}"
        # A fork's pull request must never be merged by this: its token is read-only and its
        # head is outside this repository.
        [ "${HEAD_REPO}" = "${THIS_REPO}" ] ||
          skip "Head is ${HEAD_REPO}, not ${THIS_REPO}. Refusing a fork"

        number=$(gh pr list --head "${HEAD_BRANCH}" --state open \
          --json number --jq '.[0].number // empty')
        [ -n "${number}" ] || skip "No open pull request for ${HEAD_BRANCH}"

        # workflow_run.actor is whoever pushed, this is whoever opened it.
        author=$(gh api "repos/${GH_REPO}/pulls/${number}" --jq '.user.login')
        [ "${author}" = "${BOT}" ] ||
          skip "Pull request #${number} was opened by '${author}', not ${BOT}"

        if ! gh pr view "${number}" --json labels --jq '.labels[].name' |
            grep -qxF "${LABEL}"; then
          skip "Pull request #${number} does not carry '${LABEL}'"
        fi

        # Every commit must be authored by the bot and signed by GitHub itself.
        commits=$(gh api --paginate "repos/${GH_REPO}/pulls/${number}/commits" --jq '
          .[] | [
            .sha[0:7],
            (.commit.verification.verified | tostring),
            .commit.verification.reason,
            .commit.committer.email,
            (.author.login // "-")
          ] | @tsv')
        [ -n "${commits}" ] || refuse "Pull request #${number} reports no commits"

        bad=""
        # Fed by here-doc, not a pipe, so the loop runs in this shell and bad survives it.
        while IFS=$'\t' read -r sha verified reason committer author; do
          [ -n "${sha}" ] || continue
          if [ "${verified}" != "true" ] ||
             [ "${reason}" != "valid" ] ||
             [ "${committer}" != "noreply@github.com" ] ||
             [ "${author}" != "${BOT}" ]; then
            bad="${bad}  ${sha} verified=${verified} reason=${reason} committer=${committer} author=${author}"$'\n'
          fi
        done <<EOF
        ${commits}
        EOF

        if [ -n "${bad}" ]; then
          printf '%s\n' "${bad}"
          refuse "Pull request #${number} has commits not authored by ${BOT} or not signed by GitHub"
        fi

        # An explicit if, not `[ ... ] && ...`: the latter is exempt from set -e only because it
        # is not the final command in the list, which is too subtle to leave for a later edit.
        args="--${MERGE_METHOD}"
        if [ "${DELETE_BRANCH}" = "true" ]; then
          args="${args} --delete-branch"
        fi

        # --match-head-commit refuses the merge when anything landed after the commit CI tested.
        # shellcheck disable=SC2086
        gh pr merge "${number}" ${args} --match-head-commit "${HEAD_SHA}"

        echo "merged=${number}" >>"${GITHUB_OUTPUT}"
        echo "::notice::Merged #${number} at ${HEAD_SHA}"
